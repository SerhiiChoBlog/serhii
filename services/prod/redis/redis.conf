# Allow connections from other Podman containers
bind 0.0.0.0
protected-mode no 

# Required for containers (run in foreground, log to stdout)
daemonize no
logfile ""

# Memory limits (prevents container OOM crashes)
maxmemory 256mb
maxmemory-policy noeviction

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
