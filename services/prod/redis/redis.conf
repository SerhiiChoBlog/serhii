################################## NETWORK #####################################

# In a Podman/Docker environment, bind to all interfaces so other containers 
# on the same Podman network can reach it. 
# Security is handled by protected-mode and requirepass.
bind 0.0.0.0

# Protect against external access. Since we are in a container network, 
# keep this 'yes' and use a password.
protected-mode yes

port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################## GENERAL #####################################

# Run in the foreground (required for containers)
daemonize no
supervised no
pidfile /var/run/redis_6379.pid

loglevel notice
# Logs go to stdout/stderr so Podman/Docker can capture them
logfile "" 

databases 16

################################## SECURITY ####################################

requirepass password

# Disable dangerous commands in production (optional but recommended)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

################################# MEMORY MANAGEMENT ############################

# Set a memory limit. Adjust based on your Burn server / VPS available RAM.
maxmemory 256mb

# CRITICAL FOR LARAVEL: 
# If you use Redis for Queues or Sessions, use 'noeviction'. 
# This prevents Redis from silently dropping queue jobs when memory is full.
# If you use Redis STRICTLY for caching, you can use 'allkeys-lru' to auto-evict old cache.
maxmemory-policy noeviction

################################# PERSISTENCE ##################################

# Append Only File (AOF) is recommended for Laravel to prevent queue/session 
# data loss in case of a crash.
appendonly yes
appendfilename "appendonly.aof"

# 'everysec' is the best balance between performance and durability.
appendfsync everysec

no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots (Good for backups, especially for your Burn server to fetch)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
