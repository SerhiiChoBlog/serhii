name: Main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          sudo apt update && \
          sudo apt install -y podman pipx && \
          sudo pipx ensurepath --global && \
          sudo pipx install podman-compose --global

      - name: Running tests
        shell: bash
        run: "sudo ./cmd/test"
