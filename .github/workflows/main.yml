name: 'Main'

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  test:
    runs-on: 'ubuntu-latest'
    container: 'ubuntu:latest'

    steps:
      - name: 'Setup'
        uses: './.github/actions/setup'

      - name: 'Build a development container'
        run: './cmd/run dev build'

      - name: 'Install composer dependencies'
        run: './cmd/run dev run --rm php composer install'

      - name: 'Generate an app key'
        run: 'php artisan key:generate'

      - name: 'Build a development container'
        run: './cmd/run dev up -d'

      - name: 'Run checks'
        run: './cmd/run dev composer check'
        env:
          DB_CONNECTION: 'sqlite'
          DB_DATABASE: 'database/database.sqlite'
