name: Main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Create .env files
        run: |
          cp .env.example .env
          cp app/.env.example app/.env

      - name: Install podman-compose
        run: |
          sudo apt update
          sudo apt install -y podman-compose

      - name: Build dev podman image
        run: ./cmd/run dev build

      - name: Install composer dependencies
        run: ./cmd/run dev run --rm php bash -c "composer install -n && composer update -n"

      - name: Build assets with NPM
        run: ./cmd/run dev run --rm php bash -c "npm i && npm run build"

      - name: Start development containers
        run: ./cmd/run dev up -d

      - name: Generate app key for Laravel
        run: ./cmd/run dev exec php php artisan key:generate

      - name: Migrate database
        run: |
          touch "app/database/database.sqlite"
          ./cmd/run dev exec \
              -e DB_CONNECTION=sqlite \
              -e DB_DATABASE=database/database.sqlite \
              php php artisan migrate

      - name: Run checks and tests
        run: |
          ./cmd/run dev exec \
              -e DB_CONNECTION=sqlite \
              -e DB_DATABASE=database/database.sqlite \
              php composer check

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Create authentication keys
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.SERHII_VPS_PRIVATE_SSH_KEY }}" | tee /root/.ssh/key > /dev/null
          chmod 600 /root/.ssh/key
          echo "✅ SSH keys are created: /root/.ssh/key"

      - name: Verify the host key
        run: |
          ssh-keyscan -H "${{ secrets.SERHII_VPS_IP }}" >> ~/.ssh/known_hosts
          echo "✅ SSH key verified!"

      - name: Deploy to VPS
        run: |
          source cmd/config
          echo "⌛ Transfering files to the VPS..."

          for item in "${DEPLOY_FILES[@]}"; do
              file=$(awk -F: '{ print $1 }' <<< "$item")
              dest=$(awk -F: '{ print $2 }' <<< "$item")
              scp -i /root/.ssh/key $file "serhii@${{ secrets.SERHII_VPS_IP }}:$dest"
          done

          echo "✅ Files are transfered!"

      - name: Pull changes on VPS
        run: |
          services_raw="$(git log -1 --pretty=%B | grep -oP '\{restart:\K[^}]+' || true)"

          remote() {
              ssh -i /root/.ssh/key "serhii@${{ secrets.SERHII_VPS_IP }}" \
                  "export PATH=\$PATH:/home/serhii/.local/bin && cd ~/serhiicho.com && $*"
          }

          if [[ "$services_raw" == "" ]]; then
              echo "No services to restart found. Restarting all..."
              remote ./cmd/restart
              exit 0
          fi

          services_csv="$(tr -d ' ' <<< "$services_raw")"
          IFS=',' read -r -a services <<< "$services_csv"

          echo "Restarting ${services[*]} services..."
          remote ./cmd/restart "${services[@]}"
