name: Main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build a development container
        shell: bash
        run: "sudo ./cmd/run dev build"

      - name: Install composer dependencies
        shell: bash
        run: "sudo ./cmd/run dev run --rm php composer install"

      - name: Start a development container
        shell: bash
        run: "sudo ./cmd/run dev up -d"

      - name: Run checks
        shell: bash
        run: "sudo ./cmd/run dev exec php bash -c 'php artisan key:generate && composer check'"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
