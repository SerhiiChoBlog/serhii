name: Setup Tool
runs:
  using: composite
  steps:
    - name: Add executable
      shell: bash
      run: "chmod -R +x cmd"

    - name: Copy .env file
      shell: bash
      run: "cp app/.env.example app/.env"

    - name: Install podman
      shell: bash
      run: |
        sudo apt update && \
        sudo apt install -y podman pipx && \
        sudo pipx ensurepath --global && \
        sudo pipx install podman-compose --global
