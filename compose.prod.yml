services:
  nginx:
    build:
      dockerfile: services/prod/nginx/Dockerfile
    image: docker.io/serhiicho/serhiicho:nginx
    volumes:
      - ./app/storage:/var/www/html/storage:z
      - ./certs:/etc/nginx/ssl/:ro,z

  php:
    build:
      dockerfile: services/prod/php/Dockerfile
    image: docker.io/serhiicho/serhiicho:php
    volumes:
      - ./app/.env:/var/www/html/.env:z
      - ./app/storage:/var/www/html/storage:z

  db:
    image: docker.io/serhiicho/serhiicho:db

  backup:
    build:
      dockerfile: services/prod/backup/Dockerfile
    image: docker.io/serhiicho/serhiicho:backup
    networks:
      - main
    stdin_open: true
    tty: true
    volumes:
      - ./backups:/app/backups:z
      - ./app/.env:/app/.env:ro,z
    depends_on:
      - db
    environment:
      TZ: Europe/Kyiv
