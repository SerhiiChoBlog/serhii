services:
    nginx:
        build: ./services/nginx
        image: nginx
        volumes:
            - './services/nginx/app/storage:/app/storage:z'
        networks:
            - main
        depends_on:
            - db

    php:
        build: ./services/php
        image: php
        networks:
            - main
        depends_on:
            - db

    db:
        image: 'dhi/mariadb:12.3-debian'
        ports:
            - '${FORWARD_DB_PORT:-3300}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'db:/var/lib/mysql'
        networks:
            - main
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

networks:
    main:
        driver: bridge

volumes:
    db:
        driver: local
