services:
  nginx:
    build:
      dockerfile: services/prod/nginx/Dockerfile
      platforms: [linux/amd64]
    image: registry.serhiicho.com:nginx
    platform: linux/amd64
    volumes:
      - ./app/storage:/var/www/html/storage:z
      - ./certs:/etc/nginx/ssl/:ro,z

  php:
    build:
      dockerfile: services/prod/php/Dockerfile
      platforms: [linux/amd64]
    image: registry.serhiicho.com:php
    platform: linux/amd64
    volumes:
      - ./app/.env:/var/www/html/.env:z
      - ./app/storage:/var/www/html/storage:z

  jobs:
    image: registry.serhiicho.com:php

  horizon:
    image: registry.serhiicho.com:php

  scheduler:
    image: registry.serhiicho.com:php
