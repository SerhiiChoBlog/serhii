services:
    php:
        build: ./docker/prod/php
        image: php
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            XDEBUG_MODE: 'off'
        volumes:
            - '.:/var/www/html:z'
        networks:
            - main
        depends_on:
            - db

    nginx:
        networks:
            - main

    db:
        image: 'dhi/mariadb:12.3-debian'
        ports:
            - '${FORWARD_DB_PORT:-3300}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'db:/var/lib/mysql'
        networks:
            - main
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

networks:
    main:
        driver: bridge

volumes:
    db:
        driver: local
