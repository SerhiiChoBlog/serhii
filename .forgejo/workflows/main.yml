name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testing:
    runs-on: burn
    name: Run app checks

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Pre-pull helper images
        run: podman pull docker.io/library/composer:2

      - name: Running tests
        shell: bash
        run: ./cmd/test
