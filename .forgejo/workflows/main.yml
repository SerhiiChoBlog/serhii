name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testing:
    runs-on: burn
    name: Run app checks

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          apt-get update
          apt-get install -y podman python3-pip
          pip3 install --break-system-packages podman-compose

      - name: Debug engine
        run: |
          whoami; id
          ls -ln /run/sockets/podman-runner.sock
          podman --url=unix:///run/sockets/podman-runner.sock info --format '{{.Host.Arch}} {{.Version.Version}}' || true
          podman info --format '{{.Host.RemoteClient.Version}}' 2>&1 | head -3 || true

      - name: Running tests
        shell: bash
        run: ./cmd/test
