name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testing:
    runs-on: burn
    name: Run app checks

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          apt-get update
          apt-get install -y podman python3-pip
          pip3 install --break-system-packages podman-compose

      - name: Debug engine
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          ls -l /run/sockets/podman-runner.sock || true
          podman version

      - name: Running tests
        shell: bash
        run: ./cmd/test
