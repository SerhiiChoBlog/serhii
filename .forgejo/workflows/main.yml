  deploy:
    runs-on: debian13-podman
    name: Deploy
    needs: test

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Create SSH keys
        run: |
          mkdir -p /root/.ssh
          echo "${{ secrets.SERHII_VPS_PRIVATE_SSH_KEY }}" | tee /root/.ssh/key > /dev/null
          chmod 600 /root/.ssh/key
          echo "🐧 SSH keys are created: /root/.ssh/key"

      - name: Deploy to VPS
        run: |
          source cmd/config
          echo "🐧 Transfering files to the VPS..."

          for item in "${DEPLOY_FILES[@]}"; do
              file=$(awk -F: '{ print $1 }' <<< "$item")
              dest=$(awk -F: '{ print $2 }' <<< "$item")
              scp -I /root/.ssh/key $file "serhii@${{ secrets.SERHII_VPS_IP }}:$dest"
          done
