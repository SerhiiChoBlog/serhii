name: Main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: burn
    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          apt update && \
          apt install -y podman pipx && \
          pipx --global ensurepath && \
          pipx install podman-compose --global

      - name: Running tests
        shell: bash
        run: ./cmd/test
