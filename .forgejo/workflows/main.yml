name: Main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: burn
    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          apt update
          apt install -y podman
          pip3 install --break-system-packages podman-compose

      - name: Running tests
        shell: bash
        run: ./cmd/test
