name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testing:
    runs-on: burn
    name: Run app checks

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          apt update
          apt install -y podman python3-pip
          pip3 install --break-system-packages podman-compose

      - name: Debug Socket
        run: |
          echo "Checking mounted volumes..."
          ls -la /run/sockets/ || echo "Directory /run/sockets/ does not exist!"
          echo "Checking host path directly (if permitted)..."
          ls -la /run/user/1000/podman/ || echo "Host path not accessible"

      - name: Running tests
        shell: bash
        env:
          CONTAINER_HOST: "unix:///run/sockets/podman-runner.sock"
          DOCKER_HOST: "unix:///run/sockets/podman-runner.sock"
        run: ./cmd/test
