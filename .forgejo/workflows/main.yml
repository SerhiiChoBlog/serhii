name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testing:
    runs-on: burn
    name: Run app checks

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Pre-pull helper images
        run: podman pull docker.io/library/composer:2

      - name: Create .env files
        run: |
          cp .env.example .env
          cp app/.env.example app/.env

      - name: Build dev podman  image
        run: ./cmd/run dev build

      - name: Install composer dependencies
        run: ./cmd/run dev run --rm php bash -c "composer install -n && composer update -n"

      - name: Build assets with NPM
        run: ./cmd/run dev run --rm php bash -c "npm i && npm run build"

      - name: Start development containers
        run: ./cmd/run dev up -d

      - name: Generate app key for Laravel
        run: ./cmd/run dev exec php php artisan key:generate

      - name: Migrate database
        run: |
          touch "app/database/database.sqlite"
          ./cmd/run dev exec \
              -e DB_CONNECTION=sqlite \
              -e DB_DATABASE=database/database.sqlite \
              php php artisan migrate

      - name: Run checks and tests
        run: |
          ./cmd/run dev exec \
              -e DB_CONNECTION=sqlite \
              -e DB_DATABASE=database/database.sqlite \
              php composer check
