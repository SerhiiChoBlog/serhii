name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: debian13-podman
    name: Test

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Create .env files
        run: |
          cp .env.example .env
          cp app/.env.example app/.env

      - name: Build production podman image
        run: ./cmd/run prod build

      - name: Deploying
        run: ./cmd/deploy

  deploy:
    runs-on: debian13-podman
    name: Deploy

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Create .env files
        run: |
          cp .env.example .env
          cp app/.env.example app/.env

