name: Main
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testing:
    runs-on: burn
    name: Run app checks

    container:
      image: node:lts
      volumes:
        # Use the path AS IT EXISTS INSIDE THE RUNNER CONTAINER
        - /run/sockets/podman-runner.sock:/run/sockets/podman-runner.sock

    steps:
      - name: Checkout code
        uses: "actions/checkout@v6"

      - name: Install podman
        run: |
          apt-get update
          apt-get install -y podman python3-pip
          pip3 install --break-system-packages podman-compose

      - name: Running tests
        shell: bash
        env:
          CONTAINER_HOST: "unix:///run/sockets/podman-runner.sock"
          DOCKER_HOST: "unix:///run/sockets/podman-runner.sock"
        run: ./cmd/test
