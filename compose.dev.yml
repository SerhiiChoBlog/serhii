services:
  nginx:
    build:
      dockerfile: services/dev/nginx/Dockerfile
    image: nginx-dev
    ports:
      - 8080:80
    volumes:
      - ./app:/var/www/html:z

  php:
    build:
      dockerfile: services/dev/php/Dockerfile
    image: php-dev
    ports:
      - 5173:5173
    volumes:
      - ./app:/var/www/html:z
