services:
  nginx:
    build:
      dockerfile: services/dev/nginx/Dockerfile
    volumes:
      - ./app:/var/www/html:z
      - ./storage:/var/www/html/storage:z

  php:
    build:
      dockerfile: services/dev/php/Dockerfile
    volumes:
      - ./app:/var/www/html:z
      - ./storage:/var/www/html/storage:z
