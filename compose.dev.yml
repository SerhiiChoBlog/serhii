services:
  nginx:
    build:
      dockerfile: services/dev/nginx/Dockerfile
    ports:
      - 80:80
    image: localhost/serhiicho/serhiicho:nginx
    volumes:
      - ./app:/var/www/html:z

  php:
    build:
      dockerfile: services/dev/php/Dockerfile
    image: localhost/serhiicho/serhiicho:php
    ports:
      - 5173:5173
    volumes:
      - ./app:/var/www/html:z

  db:
    ports:
      - 3300:3306

  jobs:
    image: localhost/serhiicho/serhiicho:php
    volumes:
      - ./app:/var/www/html:z

  horizon:
    image: localhost/serhiicho/serhiicho:php
    volumes:
      - ./app:/var/www/html:z

  scheduler:
    image: localhost/serhiicho/serhiicho:php
    volumes:
      - ./app:/var/www/html:z
