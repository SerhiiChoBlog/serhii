services:
  nginx:
    build:
      context: .
    ports:
      - 80:80
      - 443:443
    restart: always
    env_file: .env
    networks:
      - php-nginx
    depends_on:
      - php

  php:
    build:
      context: .
    restart: always
    env_file: .env
    networks:
      - php-nginx
      - db-php
      - php-redis
    depends_on:
      - db
      - redis

  db:
    build:
      context: .
      dockerfile: services/prod/db/Dockerfile
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db:/var/lib/mysql:z
    restart: always
    env_file: .env
    networks:
      - db-php
      - db-backup
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 3
      timeout: 5s

  backup:
    build:
      dockerfile: services/prod/backup/Dockerfile
    image: docker.io/serhiicho/serhiicho:backup
    restart: always
    env_file: .env
    networks:
      - db-backup
    volumes:
      - ./backups:/app/backups:z
      - ./app/.env:/app/.env:ro,z
    depends_on:
      - db

  jobs:
    build:
      dockerfile: services/prod/php/Dockerfile
    image: docker.io/serhiicho/serhiicho:jobs
    restart: always
    env_file: .env
    command: /usr/bin/supervisord -n
    networks:
      - jobs-redis
    depends_on:
      - redis

  redis:
    build:
      dockerfile: services/prod/redis/Dockerfile
    image: docker.io/serhiicho/serhiicho:redis
    restart: always
    env_file: .env
    volumes:
      - redis:/data:z
    networks:
      - jobs-redis
      - php-redis
    depends_on:
      - db

networks:
  php-nginx:
    driver: bridge
  db-php:
    driver: bridge
  db-backup:
    driver: bridge
  php-redis:
    driver: bridge
  jobs-redis:
    driver: bridge

volumes:
  db:
    driver: local
  redis:
    driver: local
