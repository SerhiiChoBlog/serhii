services:
  nginx:
    build:
      context: .
    ports:
      - 8080:80
    networks:
      - main
    depends_on:
      - php

  php:
    build:
      context: .
    networks:
      - main
    depends_on:
      - db

  db:
    image: docker.io/mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db:/var/lib/mysql
    networks:
      - main
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-p${DB_PASSWORD}"
      retries: 3
      timeout: 5s

networks:
  main:
    driver: bridge

volumes:
  db:
    driver: local
