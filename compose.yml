services:
  nginx:
    build:
      context: .
    ports:
      - 80:80
      - 443:443
    restart: always
    networks:
      - main
    depends_on:
      - php

  php:
    build:
      context: .
    restart: always
    networks:
      - main
    depends_on:
      - db

  db:
    image: docker.io/mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db:/var/lib/mysql:z
      - ./services/prod/db/999-serhiicho.cnf:/etc/mysql/mariadb.conf.d/999-serhiicho.cnf:ro,z
    restart: always
    networks:
      - main
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 3
      timeout: 5s

networks:
  main:
    driver: bridge

volumes:
  db:
    driver: local
