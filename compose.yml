services:
  nginx:
    ports:
      - 1000:80
    restart: always
    env_file: .env
    networks:
      - nginx-net
      - php-net
    depends_on:
      - php

  php:
    restart: always
    env_file: .env
    networks:
      - php-net
      - db-net
      - redis-net
    depends_on:
      - db
      - redis

  db:
    image: registry.serhiicho.com/serhiicho:db
    build:
      dockerfile: services/prod/db/Dockerfile
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db:/var/lib/mysql:z
    restart: always
    env_file: .env
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 3
      timeout: 5s

  backup:
    build:
      dockerfile: services/prod/backup/Dockerfile
    image: registry.serhiicho.com/serhiicho:backup
    restart: always
    env_file: .env
    networks:
      - backup-net
      - db-net
    volumes:
      - ./backups:/app/backups:z
      - ./app/.env:/app/.env:ro,z
    depends_on:
      - db

  jobs:
    restart: always
    env_file: .env
    command: /usr/bin/supervisord -n
    networks:
      - jobs-net
      - redis-net
    depends_on:
      - redis

  redis:
    build:
      dockerfile: services/prod/redis/Dockerfile
    image: registry.serhiicho.com/serhiicho:redis
    restart: always
    env_file: .env
    volumes:
      - redis-vol:/data:z
    networks:
      - redis-net

  horizon:
    restart: always
    env_file: .env
    command: php artisan horizon
    networks:
      - horizon-net
      - redis-net
    depends_on:
      - redis

  scheduler:
    restart: always
    env_file: .env
    command: supercronic /var/www/html/crontab
    stdin_open: true
    networks:
      - scheduler-net
      - redis-net
      - db-net

networks:
  php-net:
    driver: bridge
  nginx-net:
    driver: bridge
  db-net:
    driver: bridge
  backup-net:
    driver: bridge
  redis-net:
    driver: bridge
  jobs-net:
    driver: bridge
  horizon-net:
    driver: bridge
  scheduler-net:
    driver: bridge

volumes:
  db:
    driver: local
  redis-vol:
    driver: local
